<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="305" viewBox="0 0 1150 305" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo real de mensagem e resposta WhatsApp</title><desc id="desc">O cliente envia uma mensagem, o lead e a interacao sao persistidos, a analise gera sugestao, e apenas uma acao explicita envia a resposta.</desc>
  <style>.b{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.ai{fill:#faf5ff;stroke:#7e22ce;stroke-width:2}.manual{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.t{font:600 14px Arial;fill:#172554}.s{font:12px Arial;fill:#334155}.n{font:700 14px Arial;fill:#2563eb}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker></defs>
  <text class="s" x="25" y="25">Caminho automatico de entrada</text><text class="s" x="25" y="180">Caminho manual de saida</text>
  <g><circle cx="75" cy="58" r="18" fill="#dbeafe"/><text class="n" x="75" y="63" text-anchor="middle">1</text><rect class="b" x="15" y="88" width="120" height="55" rx="8"/><text class="t" x="75" y="111" text-anchor="middle">Cliente envia</text><text class="t" x="75" y="129" text-anchor="middle">mensagem</text></g>
  <g><circle cx="265" cy="58" r="18" fill="#dbeafe"/><text class="n" x="265" y="63" text-anchor="middle">2</text><rect class="b" x="185" y="88" width="160" height="55" rx="8"/><text class="t" x="265" y="111" text-anchor="middle">Gateway valida e</text><text class="t" x="265" y="129" text-anchor="middle">normaliza webhook</text></g>
  <g><circle cx="490" cy="58" r="18" fill="#dbeafe"/><text class="n" x="490" y="63" text-anchor="middle">3</text><rect class="b" x="390" y="88" width="200" height="55" rx="8"/><text class="t" x="490" y="111" text-anchor="middle">Lead Service persiste</text><text class="t" x="490" y="129" text-anchor="middle">lead e interacao IN</text></g>
  <g><circle cx="735" cy="58" r="18" fill="#ede9fe"/><text class="n" x="735" y="63" text-anchor="middle">4</text><rect class="ai" x="635" y="88" width="200" height="55" rx="8"/><text class="t" x="735" y="111" text-anchor="middle">Analise baseada em regras</text><text class="t" x="735" y="129" text-anchor="middle">score e suggestedReply</text></g>
  <g><circle cx="1010" cy="58" r="18" fill="#dbeafe"/><text class="n" x="1010" y="63" text-anchor="middle">5</text><rect class="b" x="900" y="88" width="220" height="55" rx="8"/><text class="t" x="1010" y="111" text-anchor="middle">Publica lead.created ou</text><text class="t" x="1010" y="129" text-anchor="middle">lead.updated no Kafka</text></g>
  <path class="l" d="M135 115H185M345 115H390M590 115H635M835 115H900"/>
  <g><circle cx="225" cy="215" r="18" fill="#ffedd5"/><text class="n" x="225" y="220" text-anchor="middle">6</text><rect class="manual" x="125" y="245" width="200" height="45" rx="8"/><text class="t" x="225" y="273" text-anchor="middle">Operador ou n8n solicita envio</text></g>
  <g><circle cx="535" cy="215" r="18" fill="#ffedd5"/><text class="n" x="535" y="220" text-anchor="middle">7</text><rect class="manual" x="425" y="245" width="220" height="45" rx="8"/><text class="t" x="535" y="273" text-anchor="middle">Notification consulta e envia</text></g>
  <g><circle cx="870" cy="215" r="18" fill="#dbeafe"/><text class="n" x="870" y="220" text-anchor="middle">8</text><rect class="b" x="760" y="245" width="220" height="45" rx="8"/><text class="t" x="870" y="273" text-anchor="middle">Meta devolve status ao Gateway</text></g>
  <path class="l" d="M325 267H425M645 267H760"/><path class="l" d="M980 267H1080V160H490V143"/><text class="s" x="770" y="172" text-anchor="middle">Gateway atualiza a interacao OUT no Lead Service</text>
</svg>
