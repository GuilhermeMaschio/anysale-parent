<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="315" viewBox="0 0 1100 315" role="img" aria-labelledby="title desc">
  <title id="title">Eventos Kafka reais do AnySale</title><desc id="desc">Uma mensagem nova pode publicar lead.created e sempre publica lead.updated; catalogo consome criacao e notificacao consome atualizacoes.</desc>
  <style>.lead{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.event{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.svc{fill:#f8fafc;stroke:#475569;stroke-width:2}.store{fill:#ecfdf5;stroke:#059669;stroke-width:2}.t{font:600 14px Arial;fill:#172554}.s{font:12px Arial;fill:#334155}.l{stroke:#64748b;stroke-width:2;marker-end:url(#a)}.d{stroke:#ea580c;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#o)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#64748b"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#ea580c"/></marker></defs>
  <rect class="lead" x="25" y="125" width="170" height="60" rx="8"/><text class="t" x="110" y="149" text-anchor="middle">Lead Service recebe</text><text class="t" x="110" y="168" text-anchor="middle">mensagem nova</text>
  <rect class="event" x="280" y="40" width="150" height="60" rx="8"/><text class="t" x="355" y="65" text-anchor="middle">lead.created</text><text class="s" x="355" y="84" text-anchor="middle">somente novo lead</text>
  <rect class="event" x="280" y="210" width="150" height="60" rx="8"/><text class="t" x="355" y="235" text-anchor="middle">lead.updated</text><text class="s" x="355" y="254" text-anchor="middle">toda mensagem recebida</text>
  <rect class="svc" x="530" y="40" width="160" height="60" rx="8"/><text class="t" x="610" y="65" text-anchor="middle">Catalog Service</text><text class="s" x="610" y="84" text-anchor="middle">consome created</text>
  <rect class="store" x="770" y="40" width="130" height="60" rx="8"/><text class="t" x="835" y="65" text-anchor="middle">MongoDB</text><text class="s" x="835" y="84" text-anchor="middle">produtos</text>
  <rect class="lead" x="530" y="145" width="160" height="60" rx="8"/><text class="t" x="610" y="170" text-anchor="middle">Lead Service</text><text class="s" x="610" y="189" text-anchor="middle">anexa sugestoes</text>
  <rect class="svc" x="840" y="210" width="205" height="60" rx="8"/><text class="t" x="942" y="235" text-anchor="middle">Notification Service</text><text class="s" x="942" y="254" text-anchor="middle">guarda historico em memoria</text>
  <path class="d" d="M195 143H235V70H280M195 168H280V240"/><path class="d" d="M430 70H530M690 70H770M610 100V145M690 175H760V240H840M430 240H840"/>
  <text class="s" x="705" y="135" text-anchor="middle">PATCH suggestions gera novo lead.updated</text>
</svg>
