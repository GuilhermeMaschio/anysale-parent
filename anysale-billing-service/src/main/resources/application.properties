spring.application.name=anysale-billing-service
server.port=${SERVER_PORT:8084}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/anysale}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anysale}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Billing owns an independent migration history and can later use its own database without coupling to Lead Service migrations.
spring.flyway.table=billing_flyway_schema_history
anysale.security.enabled=${ANYSALE_SECURITY_ENABLED:false}
anysale.security.keycloak.client-id=${ANYSALE_SECURITY_KEYCLOAK_CLIENT_ID:anysale-console}
anysale.tenant.local-id=${ANYSALE_LOCAL_TENANT_ID:anysale}
anysale.billing.asaas.enabled=${ANYSALE_BILLING_ASAAS_ENABLED:false}
anysale.billing.asaas.api-key=${ANYSALE_BILLING_ASAAS_API_KEY:}
anysale.billing.asaas.webhook-token=${ANYSALE_BILLING_ASAAS_WEBHOOK_TOKEN:}
anysale.billing.asaas.base-url=${ANYSALE_BILLING_ASAAS_BASE_URL:https://api.asaas.com/v3}
anysale.billing.asaas.checkout-success-url=${ANYSALE_BILLING_CHECKOUT_SUCCESS_URL:}
anysale.billing.asaas.checkout-cancel-url=${ANYSALE_BILLING_CHECKOUT_CANCEL_URL:}
anysale.billing.asaas.checkout-expired-url=${ANYSALE_BILLING_CHECKOUT_EXPIRED_URL:}
management.endpoints.web.exposure.include=health,info
