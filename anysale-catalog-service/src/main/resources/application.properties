spring.application.name=anysale-catalog-service

# Porta
server.port=8082

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/anysale

# Em dev local sem Keycloak, usa o tenant abaixo. Em ambientes protegidos,
# tenant_id é obrigatório no token JWT.
anysale.security.enabled=${ANYSALE_SECURITY_ENABLED:false}
anysale.tenant.local-id=${ANYSALE_TENANT_LOCAL_ID:anysale}
anysale.security.keycloak.client-id=${KEYCLOAK_CLIENT_ID:anysale-console}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/anysale-realm}

# Kafka (consumer)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=catalog-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.anysale.*


# HTTP ? lead-service (WebClient usa este baseUrl)
lead-service.base-url=http://localhost:8080

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,mappings
