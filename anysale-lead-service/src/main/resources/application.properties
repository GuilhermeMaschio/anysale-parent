spring.application.name=anysale-lead-service

server.port=${SERVER_PORT:8080}

# Postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/anysale}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:anysale}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:lead-service}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.anysale.*
spring.kafka.properties.spring.json.add.type.headers=true
internal.auth.token=${ANYSALE_INTERNAL_TOKEN:}
notification-service.base-url=${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8081}
catalog-service.base-url=${CATALOG_SERVICE_BASE_URL:http://localhost:8082}
anysale.security.enabled=${ANYSALE_SECURITY_ENABLED:false}
anysale.security.keycloak.client-id=${ANYSALE_SECURITY_KEYCLOAK_CLIENT_ID:anysale-console}
anysale.tenant.local-id=${ANYSALE_LOCAL_TENANT_ID:anysale}

# Keycloak service account used only by the Lead Service to administer AnySale operators.
# Keep the client secret outside the repository; it must never be exposed as a VITE_* variable.
anysale.keycloak-admin.enabled=${ANYSALE_KEYCLOAK_ADMIN_ENABLED:false}
anysale.keycloak-admin.issuer-uri=${KEYCLOAK_ISSUER:}
anysale.keycloak-admin.realm=${ANYSALE_KEYCLOAK_ADMIN_REALM:anysale-realm}
anysale.keycloak-admin.client-id=${ANYSALE_KEYCLOAK_ADMIN_CLIENT_ID:}
anysale.keycloak-admin.client-secret=${ANYSALE_KEYCLOAK_ADMIN_CLIENT_SECRET:}
anysale.keycloak-admin.tenant-id=${ANYSALE_KEYCLOAK_ADMIN_TENANT_ID:anysale}

# Asaas secrets stay only in the service environment. Billing endpoints remain inactive until enabled.
anysale.billing.asaas.enabled=${ANYSALE_BILLING_ASAAS_ENABLED:false}
anysale.billing.asaas.api-key=${ANYSALE_BILLING_ASAAS_API_KEY:}
anysale.billing.asaas.webhook-token=${ANYSALE_BILLING_ASAAS_WEBHOOK_TOKEN:}

# Optional AI provider. With the default setting, lead enrichment continues using local rules only.
anysale.ai.openai.enabled=${ANYSALE_AI_OPENAI_ENABLED:false}
anysale.ai.openai.api-key=${OPENAI_API_KEY:}
anysale.ai.openai.model=${OPENAI_MODEL:}
anysale.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
anysale.ai.openai.allowed-models=${OPENAI_ALLOWED_MODELS:}

# Actuator
management.endpoints.web.exposure.include=health,info,mappings
management.endpoint.mappings.enabled=true
